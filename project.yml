name: Listen
options:
  bundleIdPrefix: com.aidanmullins
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Swift 6 compiler, Swift 5 language mode: avoids strict-concurrency errors
    # around AVFoundation/MediaPlayer callbacks that we can't iterate on locally.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Listen:
    type: application
    platform: iOS
    sources:
      - path: Listen
    info:
      path: Listen/Info.plist
      properties:
        CFBundleDisplayName: Listen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes: [audio]
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aidanmullins.listen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

  ListenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ListenTests
    dependencies:
      - target: Listen
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Listen:
    build:
      targets:
        Listen: all
        ListenTests: [test]
    test:
      config: Debug
      targets:
        - ListenTests
