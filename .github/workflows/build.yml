name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Unit tests (iOS Simulator)
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[]
                      | select(.key | test("iOS-(1[89]|[2-9][0-9])"))
                      | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          echo "Testing on simulator $UDID"
          xcodebuild test \
            -project Listen.xcodeproj \
            -scheme Listen \
            -destination "id=$UDID" \
            -derivedDataPath build/test

      - name: Build unsigned IPA
        run: |
          xcodebuild build \
            -project Listen.xcodeproj \
            -scheme Listen \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -R build/release/Build/Products/Release-iphoneos/Listen.app Payload/
          zip -qry Listen.ipa Payload
          ls -lh Listen.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Listen-ipa
          path: Listen.ipa
          retention-days: 30
